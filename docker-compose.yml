services:
  # 1. Base de données PostgreSQL
  db:
    image: postgres:15-alpine # Alpine = version très légère, parfaite pour toute machine Linux / Raspberry Pi
    container_name: panel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-ourcraft}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ourcraft_secret}
      POSTGRES_DB: ${DB_NAME:-ourcraft_db}
    volumes:
      - pg_data:/var/lib/postgresql/data # Sauvegarde les données même si le conteneur est détruit
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ourcraft} -d ${DB_NAME:-ourcraft_db}"]
      interval: 2s
      timeout: 5s
      retries: 15

  # 2. Notre Backend FastAPI (Python)
  backend:
    build:
      context: ./backend
      network: host
    container_name: panel_backend
    restart: unless-stopped
    environment:
      # Valeurs par défaut intégrées : fonctionne immédiatement après un git clone sans toucher au code
      DATABASE_URL: postgresql://${DB_USER:-ourcraft}:${DB_PASSWORD:-ourcraft_secret}@panel_db:5432/${DB_NAME:-ourcraft_db}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app # Permet de modifier le code Python sans relancer Docker (Hot Reload)
      - /var/run/docker.sock:/var/run/docker.sock # Donne accès au démon Docker de l'hôte
      - ./ssh_keys:/root/.ssh:ro # Dossier pour les clés SSH
      - /home:/home # Permet de choisir n'importe quel dossier utilisateur depuis l'interface Web
      - /srv:/srv   # Supporte aussi les dossiers serveurs dans /srv
      - /mnt:/mnt   # Supporte les disques externes / SSD montés dans /mnt
      - /opt:/opt   # Supporte /opt
    depends_on:
      db:
        condition: service_healthy

  # 3. Notre Frontend React/Vite
  frontend:
    build:
      context: ./frontend
      network: host
    container_name: panel_frontend
    restart: unless-stopped
    ports:
      - "5173:5173" # Port par défaut de Vite
    volumes:
      - ./frontend:/app # Hot Reload pour le front
      - /app/node_modules # Préserve les modules installés dans le conteneur
    depends_on:
      - backend

# Déclaration du volume persistant pour la base de données
volumes:
  pg_data:
