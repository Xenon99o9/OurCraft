<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="#1E1F22"/>
  <!-- Face supérieure (Herbe / Émeraude) -->
  <polygon points="32,12 52,23 32,34 12,23" fill="#23A559"/>
  <!-- Face gauche -->
  <polygon points="12,23 32,34 32,53 12,42" fill="#5865F2"/>
  <!-- Face droite -->
  <polygon points="52,23 32,34 32,53 52,42" fill="#3B45B8"/>
  <!-- Bordure subtile du cube -->
  <polyline points="12,23 32,34 52,23" stroke="#111214" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="32" y1="34" x2="32" y2="53" stroke="#111214" stroke-width="1.5"/>
</svg>
